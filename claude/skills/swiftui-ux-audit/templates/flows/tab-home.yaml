# Maestro flow: Home tab. The skill substitutes {{BUNDLE_ID}}.
appId: {{BUNDLE_ID}}
---
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Home"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: home_landing
- scroll
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: home_scrolled
